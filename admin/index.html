<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GAON#(대표)">
<title>GAON#(대표)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../shell.css?v=10">
<link rel="preload" as="image" href="../icons/logo.png">
<link rel="preload" as="image" href="../icons/logo-start.png">
<style>
  /* 시작 그림: 영상에서 로고가 다 나타난 장면(1.8초). 영상과 같은 자리·크기로 먼저 보여 주고, 영상이 그 장면에 오면 사라짐 */
  #splash #splashImg { position:absolute; left:50%; top:calc(50vh - 37px); top:calc(50dvh - 37px); transform:translate(-50%, -50%); width:min(360px, calc((100vw - 32px) * 0.86)); height:min(360px, calc((100vw - 32px) * 0.86)); object-fit:contain; background:#fff; pointer-events:none; border:0; outline:0; -webkit-mask-image:linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%); -webkit-mask-composite:source-in; mask-image:linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%); mask-composite:intersect; z-index:1; transition:opacity .15s; }
  #splash #splashImg.off { opacity:0; }
</style>
</head>
<body>
<iframe id="app" title="GAON#(대표)" allow="camera; microphone; clipboard-write; autoplay; fullscreen; screen-wake-lock"></iframe>

<div id="splash">
  <img id="splashImg" src="../icons/logo-start.png" alt="">
  <video id="splashVid" src="../icons/logo.mp4?v=11#t=1.8" autoplay muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
  <div id="splashMsg"></div>
</div>
<script>
  // 로고 영상: 처음 실행할 때는 영상이 끝까지 나온 뒤 로그인 화면으로 넘어감
  // 앞부분(빈 화면 → 로고가 흐리게 나타남)은 건너뛰고 1.8초부터: 휴대폰 시작 화면 로고 → 같은 로고 그림 → 반짝임 → 문구
  (function () {
    var v = document.getElementById('splashVid'), sp = document.getElementById('splash'), img = document.getElementById('splashImg');
    var START = 1.8;
    function toStart() { try { if (v.currentTime < START - 0.05) v.currentTime = START; } catch (e) {} }
    v.addEventListener('loadedmetadata', toStart);
    v.addEventListener('timeupdate', function () { if (!v.paused && v.currentTime >= START - 0.02) img.classList.add('off'); });
    var ended = false, waiters = [];
    function finish() {
      if (ended) return;
      ended = true;
      var w = waiters; waiters = [];
      w.forEach(function (f) { f(); });
    }
    v.addEventListener('ended', finish);
    v.addEventListener('error', finish);
    setTimeout(finish, 10000); // 영상이 멈추거나 늦게 받아져도 10초 뒤에는 넘어감
    function play() { v.muted = true; var p = v.play(); if (p && p.catch) p.catch(finish); }
    window.splashWait = function (done) { if (ended) done(); else waiters.push(done); };
    play();
    new MutationObserver(function () {
      if (sp.classList.contains('hide')) v.pause();
      else { img.classList.remove('off'); try { v.currentTime = START; } catch (e) {} play(); }
    }).observe(sp, { attributes: true, attributeFilter: ['class'] });
  })();
</script>

<div id="iosTip">
  알림을 받으려면 아래 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 누르고, 홈 화면의 <b>GAON#(대표)</b> 아이콘으로 열어 주세요.
  <button id="iosTipClose" aria-label="닫기">×</button>
</div>

<div id="pushSheet">
  <div class="sheet">
    <img src="../icons/icon-192.png" alt="">
    <h2>알림 켜기</h2>
    <p id="pushMsg"></p>
    <button id="pushOn" class="go">알림 켜기</button>
    <button id="pushLater" class="later">나중에</button>
  </div>
</div>

<div id="toast"></div>

<script>window.SHELL_KIND = 'admin';</script>
<script src="../config.js?v=10"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="../shell.js?v=10"></script>
</body>
</html>
