<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GAON#(대표)">
<title>GAON#(대표)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../shell.css?v=8">
</head>
<body>
<iframe id="app" title="GAON#(대표)" allow="camera; microphone; clipboard-write; autoplay; fullscreen; screen-wake-lock"></iframe>

<div id="splash">
  <video id="splashVid" src="../icons/logo.mp4" autoplay muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
  <div id="splashMsg"></div>
</div>
<script>
  // 로고 영상: 처음 실행할 때는 영상이 끝까지 나온 뒤 로그인 화면으로 넘어감
  (function () {
    var v = document.getElementById('splashVid'), sp = document.getElementById('splash');
    var ended = false, waiters = [];
    function finish() {
      if (ended) return;
      ended = true;
      var w = waiters; waiters = [];
      w.forEach(function (f) { f(); });
    }
    v.addEventListener('ended', finish);
    v.addEventListener('error', finish);
    setTimeout(finish, 8000); // 영상이 멈추거나 늦게 받아져도 8초 뒤에는 넘어감
    function play() { v.muted = true; var p = v.play(); if (p && p.catch) p.catch(finish); }
    window.splashWait = function (done) { if (ended) done(); else waiters.push(done); };
    play();
    new MutationObserver(function () {
      if (sp.classList.contains('hide')) v.pause();
      else { try { v.currentTime = 0; } catch (e) {} play(); }
    }).observe(sp, { attributes: true, attributeFilter: ['class'] });
  })();
</script>

<div id="iosTip">
  알림을 받으려면 아래 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 누르고, 홈 화면의 <b>GAON#(대표)</b> 아이콘으로 열어 주세요.
  <button id="iosTipClose" aria-label="닫기">×</button>
</div>

<div id="pushSheet">
  <div class="sheet">
    <img src="../icons/icon-192.png" alt="">
    <h2>알림 켜기</h2>
    <p id="pushMsg"></p>
    <button id="pushOn" class="go">알림 켜기</button>
    <button id="pushLater" class="later">나중에</button>
  </div>
</div>

<div id="toast"></div>

<script>window.SHELL_KIND = 'admin';</script>
<script src="../config.js?v=8"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="../shell.js?v=8"></script>
</body>
</html>
