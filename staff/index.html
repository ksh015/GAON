<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GAON#">
<title>GAON#</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../shell.css?v=4">
</head>
<body>
<iframe id="app" title="GAON#" allow="camera; microphone; clipboard-write; autoplay; fullscreen; screen-wake-lock"></iframe>

<div id="splash">
  <img src="../icons/icon-512.png" alt="GAON#">
  <div class="spin"></div>
  <div id="splashMsg">불러오는 중...</div>
</div>

<div id="iosTip">
  알림을 받으려면 아래 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 누르고, 홈 화면의 <b>GAON#</b> 아이콘으로 열어 주세요.
  <button id="iosTipClose" aria-label="닫기">×</button>
</div>

<div id="pushSheet">
  <div class="sheet">
    <img src="../icons/icon-192.png" alt="">
    <h2>알림 켜기</h2>
    <p id="pushMsg"></p>
    <button id="pushOn" class="go">알림 켜기</button>
    <button id="pushLater" class="later">나중에</button>
  </div>
</div>

<div id="toast"></div>

<script>window.SHELL_KIND = 'staff';</script>
<script src="../config.js?v=4"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="../shell.js?v=4"></script>
</body>
</html>
